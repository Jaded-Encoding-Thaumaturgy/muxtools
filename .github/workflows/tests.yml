name: Run tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Cache project binaries
        uses: actions/cache@v6.1.0
        with:
          path: .muxtools/bins
          key: ${{ runner.os }}-${{ runner.arch }}-binaries-${{ hashFiles('muxtools.toml') }}

      - name: Sync project binaries
        run: uv run --python ${{ matrix.python-version }} muxtools binaries sync

      - name: Run tests (Python ${{ matrix.python-version }})
        run: uv run --python ${{ matrix.python-version }} pytest tests

      - name: Post webhook for failure
        if: failure() && github.event_name != 'pull_request'
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
