name: Lint
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.15']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run ruff check (Python ${{ matrix.python-version }})
        run: uv run --python ${{ matrix.python-version }} ruff check ./muxtools/

      - name: Run Pyrefly (Python ${{ matrix.python-version }})
        run: uv run --python ${{ matrix.python-version }} pyrefly check

      - name: Post webhook for failure
        if: failure() && github.event_name != 'pull_request'
        uses: Jaded-Encoding-Thaumaturgy/discord-failure-notifier@v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
